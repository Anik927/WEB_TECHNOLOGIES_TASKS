<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-3</title>
    <link rel="stylesheet" href="Lab_2_Task-3_style.css">
</head>
<body>
    <h1>Lab Task 03</h1>
    <h2>CSS Box Model and Positioning</h2>

    <div id="box1">
        <p>This is a box with padding, border, and margin.</p>
    </div>

    <hr>

    <div id="box2">
        <p>This box is 2.</p>
    </div>

    <hr>

    <div id="box3">
        <p>This box is 3.</p>
    </div>

    <hr>

    <div class="block">Block DIV</div>
    <div class="inline">Inline DIV</div>
    
    <br><br>

    <span class="span-block">Span changed to block</span>
    <span class="span-inlineblock">Span inline-block</span>

    <p class="remove">This paragraph will use display: none</p>
    <p class="hide">This paragraph will use visibility: hidden</p>

    
</body>
</html>
